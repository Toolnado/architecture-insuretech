alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
server:
  persistentVolume:
    enabled: false
  service:
    type: NodePort
  global:
    scrape_interval: 15s
    scrape_timeout: 10s
    evaluation_interval: 15s
