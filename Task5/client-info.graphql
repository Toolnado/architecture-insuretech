"""
Дата в формате ISO-8601 (YYYY-MM-DD).
В REST-контракте issueDate и expiryDate объявлены как string без формата,
здесь формат зафиксирован в типе.
"""
scalar Date

"""Тип документа клиента."""
enum DocumentType {
  PASSPORT
  INTERNATIONAL_PASSPORT
  DRIVER_LICENSE
  VEHICLE_REGISTRATION
  SNILS
  INN
  BIRTH_CERTIFICATE
}

"""Степень родства."""
enum RelationType {
  SPOUSE
  CHILD
  PARENT
  SIBLING
  GRANDPARENT
  GRANDCHILD
  OTHER
}

"""
Карточка клиента — корневая сущность сервиса client-info.
Объекты данных карточки (документы, родственники и другие) объявлены полями
самого клиента: потребитель получает их в одном запросе и только те, которые
нужны его сценарию.
"""
type Client {
  """Идентификатор клиента."""
  id: ID!

  """Фамилия, имя и отчество клиента."""
  name: String!

  """Полных лет."""
  age: Int

  """
  Документы клиента.
  Эквивалент GET /clients/{id}/documents.
  """
  documents(
    """Отбор по типу документа. Без аргумента возвращаются все документы."""
    type: DocumentType

    """Только действующие на текущую дату документы."""
    onlyValid: Boolean = false
  ): [Document!]!

  """
  Родственники клиента.
  Эквивалент GET /clients/{id}/relatives.
  """
  relatives(
    """Отбор по степени родства. Без аргумента возвращаются все родственники."""
    relationType: RelationType
  ): [Relative!]!
}

"""Документ клиента."""
type Document {
  """Идентификатор документа."""
  id: ID!

  """Тип документа."""
  type: DocumentType!

  """Серия и номер."""
  number: String!

  """Дата выдачи."""
  issueDate: Date

  """Дата окончания срока действия. null — документ бессрочный."""
  expiryDate: Date
}

"""Родственник клиента."""
type Relative {
  """Идентификатор записи о родственнике."""
  id: ID!

  """Степень родства по отношению к клиенту."""
  relationType: RelationType!

  """Фамилия, имя и отчество родственника."""
  name: String!

  """Полных лет."""
  age: Int
}

"""Запросы к клиентским данным."""
type Query {
  """
  Карточка клиента по идентификатору.
  Эквивалент GET /clients/{id}, но набор возвращаемых объектов данных
  задаёт потребитель.
  Возвращает null, если клиент не найден.
  """
  client(
    """Идентификатор клиента."""
    id: ID!
  ): Client

  """
  Карточки нескольких клиентов за один запрос.
  Порядок элементов ответа совпадает с порядком идентификаторов в аргументе,
  для ненайденного клиента возвращается null.
  """
  clients(
    """Идентификаторы клиентов, не более 100 за запрос."""
    ids: [ID!]!
  ): [Client]!
}

schema {
  query: Query
}
